name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m pyflakes src tests api main.py

      - name: Test
        # The whole suite runs against the mock gateway: no key, no network.
        run: python -m pytest -q

  bundle:
    # The deployed playground installs only requirements.txt. This proves the
    # app still imports with LiteLLM, Rich and Uvicorn absent, so a serverless
    # build cannot be broken by an import added higher up the stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deployment dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import the Vercel entry point
        run: |
          cd api && python -c "import index; print(index.app.title, len(index.app.routes), 'routes')"
